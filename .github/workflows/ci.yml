name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install click mypy
      - run: mypy src/ghidra_decomp/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - name: Test fixture checksums and provenance without Ghidra
        run: pytest tests/test_multiarch_e2e.py::test_checked_in_fixture_hashes_and_provenance
      - run: >
          pytest tests/test_artifacts.py tests/test_cache.py
          tests/test_decompiler_helpers.py tests/test_filters.py
          tests/test_parallel.py

  # Note: e2e tests require a Ghidra installation and are not run in CI.
  # Run them locally with: pytest tests/

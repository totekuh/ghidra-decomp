[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghidra-decomp"
dynamic = ["version"]
description = "Bulk-decompile binaries via Ghidra into a browsable source tree"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "totekuh", email = "totekuh@protonmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "pyghidra>=3.0",
    "click>=8",
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.9",
    "mypy",
]

[project.scripts]
ghidra-decomp = "ghidra_decomp.cli:main"
ghidra-decomp-query = "ghidra_decomp.cli:query"

[project.urls]
Homepage = "https://github.com/totekuh/ghidra-decomp"
Repository = "https://github.com/totekuh/ghidra-decomp"
Issues = "https://github.com/totekuh/ghidra-decomp/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["ghidra_decomp"]
omit = [
    "src/ghidra_decomp/polish/*",
    "src/ghidra_decomp/decompiler/export/*",
    "src/ghidra_decomp/decompiler/setup/ghidra.py",
    "src/ghidra_decomp/decompiler/setup/resume.py",
    "src/ghidra_decomp/decompiler/orchestrator.py",
    "src/ghidra_decomp/kernel_gdt/export.py",
    "src/ghidra_decomp/pdb.py",
    "src/ghidra_decomp/cli/query_cmd.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_decomp"]

[tool.hatch.version]
path = "src/ghidra_decomp/__init__.py"
